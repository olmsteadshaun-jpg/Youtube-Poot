<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<title>PootiLurk</title>
</head>

<body style="background:#0b1220;color:white;font-family:sans-serif;text-align:center;padding-top:100px;">

<h2>PootiLurk</h2>

<input id="email" placeholder="Email"><br><br>
<input id="password" type="password" placeholder="Password"><br><br>

<button onclick="signup()">Sign Up</button>
<button onclick="login()">Login</button>

<p id="msg"></p>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.js"></script>

<script>
const client = window.supabase.createClient(
  "https://aujzhgdxnvcdxrjxkrlu.supabase.co",
  "sb_publishable_0X6rYnfD2-NNEy1I5YB6IQ_WxVHfMlF"
);

function show(t){ document.getElementById("msg").innerText = t; }

async function signup(){
  const { error } = await client.auth.signUp({
    email: email.value,
    password: password.value
  });
  show(error ? error.message : "Signup OK");
}

async function login(){
  const { error } = await client.auth.signInWithPassword({
    email: email.value,
    password: password.value
  });
  show(error ? error.message : "Login OK 🎉");
}
</script>

</body>
</html>
