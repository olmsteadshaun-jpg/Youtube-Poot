<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<title>PootiLurk - Test</title>
<style>
body{
  margin:0;
  font-family:Segoe UI;
  background:#0b1220;
  color:white;
  display:flex;
  justify-content:center;
  align-items:center;
  height:100vh;
}
.box{
  background:#020617;
  padding:30px;
  border-radius:10px;
  text-align:center;
  width:400px;
}
input{
  width:100%;
  padding:10px;
  margin-bottom:10px;
}
button{
  width:100%;
  padding:10px;
  background:#2563eb;
  color:white;
  border:none;
}
iframe{
  width:100%;
  height:250px;
  margin-top:10px;
}
</style>
</head>

<body>

<div class="box">
  <h2>PootiLurk Test</h2>

  <input id="input" placeholder="Paste YouTube link or ID">

  <button onclick="play()">Play</button>

  <iframe id="player"></iframe>
</div>

<script>
function play(){
  let input = document.getElementById("input").value.trim();

  let id = input;

  // handle full youtube link
  if(input.includes("watch?v=")){
    id = input.split("v=")[1];
    if(id.includes("&")) id = id.split("&")[0];
  }

  // handle youtu.be links
  if(input.includes("youtu.be/")){
    id = input.split("youtu.be/")[1];
  }

  document.getElementById("player").src =
    "https://www.youtube.com/embed/" + id;
}
</script>

</body>
</html>
