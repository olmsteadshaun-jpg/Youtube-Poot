<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<title>PootiLurk</title>

<style>
body{
  margin:0;
  font-family:Segoe UI;
  background:#0b1220;
  color:white;
}

.top{
  padding:10px;
  background:#020617;
  display:flex;
  gap:10px;
}

input{
  padding:10px;
  flex:1;
}

button{
  padding:10px;
  background:#2563eb;
  color:white;
  border:none;
  cursor:pointer;
}

.grid{
  display:grid;
  grid-template-columns: repeat(auto-fit, minmax(260px, 1fr));
  gap:10px;
  padding:10px;
}

.player{
  background:#111827;
  position:relative;
  border-radius:6px;
  overflow:hidden;
}

.active{
  outline:2px solid #22c55e;
}

iframe{
  width:100%;
  height:180px;
  border:none;
}

.thumb{
  width:100%;
  height:180px;
  object-fit:cover;
  cursor:pointer;
}

.controls{
  position:absolute;
  top:5px;
  right:5px;
  display:flex;
  gap:5px;
}

.small{
  padding:4px;
  font-size:12px;
}
</style>
</head>

<body>

<div class="top">
  <input id="input" placeholder="Paste YouTube link or ID">
  <button onclick="add()">Add</button>
  <button onclick="toggleRotate()">Rotate ▶</button>
</div>

<div id="grid" class="grid"></div>

<script>
let videos = JSON.parse(localStorage.getItem("videos") || "[]");
let current = 0;
let rotating = false;
let interval = null;

function save(){
  localStorage.setItem("videos", JSON.stringify(videos));
}

function extractId(input){
  if(input.includes("watch?v=")){
    return input.split("v=")[1].split("&")[0];
  }
  if(input.includes("youtu.be/")){
    return input.split("youtu.be/")[1];
  }
  return input;
}

function add(){
  let val = document.getElementById("input").value.trim();
  if(!val) return;

  let id = extractId(val);

  // prevent duplicates
  if(videos.some(v => v.id === id)) return;

  videos.push({ id, muted:true });
  save();
  render();

  document.getElementById("input").value = "";
}

function remove(index){
  videos.splice(index,1);
  save();
  render();
}

function toggleMute(index){
  videos[index].muted = !videos[index].muted;
  render();
}

function play(index){
  current = index;
  render();
}

function render(){
  let grid = document.getElementById("grid");
  grid.innerHTML = "";

  videos.forEach((v,i)=>{
    let div = document.createElement("div");
    div.className = "player " + (i === current ? "active" : "");

    let content = i === current
      ? `<iframe src="https://www.youtube.com/embed/${v.id}?autoplay=1&mute=${v.muted ? 1 : 0}"></iframe>`
      : `<img class="thumb" src="https://img.youtube.com/vi/${v.id}/hqdefault.jpg" onclick="play(${i})">`;

    div.innerHTML = `
      <div class="controls">
        <button class="small" onclick="toggleMute(${i})">${v.muted ? "🔇" : "🔊"}</button>
        <button class="small" onclick="remove(${i})">❌</button>
      </div>
      ${content}
    `;

    grid.appendChild(div);
  });
}

function next(){
  if(videos.length === 0) return;
  current = (current + 1) % videos.length;
  render();
}

function toggleRotate(){
  rotating = !rotating;

  if(rotating){
    interval = setInterval(next, 30000); // every 30 sec
  } else {
    clearInterval(interval);
  }
}

render();
</script>

</body>
</html>
