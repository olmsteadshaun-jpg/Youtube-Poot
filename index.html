<script>
let videos = JSON.parse(localStorage.getItem("videos") || "[]");

let startIndex = 0;
let visibleCount = 9;
let delay = 120000;
let interval = null;
let rotating = false;

let activeAudio = 0;
let metaCache = {};

let dragFrom = null;

function save(){
  localStorage.setItem("videos", JSON.stringify(videos));
}

function extractId(input){
  if(input.includes("watch?v=")){
    return input.split("v=")[1].split("&")[0];
  }
  if(input.includes("youtu.be/")){
    return input.split("youtu.be/")[1];
  }
  return input;
}

function add(){
  let val = input.value.trim();
  if(!val) return;

  let id = extractId(val);
  if(id.length !== 11) return alert("Invalid video");

  if(videos.includes(id)) return;

  videos.push(id);
  save();
  render();
  input.value="";
}

function remove(index){
  videos.splice(index,1);
  save();
  render();
}

async function getMeta(id){
  if(metaCache[id]) return metaCache[id];

  try{
    let res = await fetch(`https://www.youtube.com/oembed?url=https://www.youtube.com/watch?v=${id}&format=json`);
    let data = await res.json();
    metaCache[id] = data;
    return data;
  }catch{
    return {title:id, author_name:"Unknown"};
  }
}

/* 🔥 DRAG + OPTIMIZED RENDER */
async function render(){
  let grid = document.getElementById("grid");
  grid.innerHTML="";

  if(videos.length === 0) return;

  let batch = [];

  for(let i=0;i<visibleCount;i++){
    let index=(startIndex+i)%videos.length;
    let id=videos[index];

    let card=document.createElement("div");
    card.className="card";
    card.draggable = true;
    card.dataset.index = index;

    if(index===activeAudio) card.classList.add("active");

    /* 🎯 DRAG EVENTS */
    card.ondragstart = () => {
      dragFrom = index;
    };

    card.ondragover = (e) => e.preventDefault();

    card.ondrop = () => {
      let temp = videos[dragFrom];
      videos[dragFrom] = videos[index];
      videos[index] = temp;

      save();
      render();
    };

    let iframe=document.createElement("iframe");
    iframe.loading="lazy";
    iframe.src=`https://www.youtube.com/embed/${id}?autoplay=1&mute=${index===activeAudio?0:1}&loop=1&playlist=${id}&playsinline=1`;
    iframe.allow="autoplay";

    let info=document.createElement("div");
    info.className="info";

    getMeta(id).then(meta=>{
      info.innerText = meta.title + " • " + meta.author_name;
    });

    let close=document.createElement("button");
    close.className="close";
    close.innerText="✖";
    close.onclick=(e)=>{
      e.stopPropagation();
      remove(index);
    };

    card.onclick=()=>{
      activeAudio=index;
      render();
    };

    card.appendChild(close);
    card.appendChild(iframe);
    card.appendChild(info);

    batch.push(card);
  }

  batch.forEach((card,i)=>{
    setTimeout(()=>{
      grid.appendChild(card);
    }, i * 80);
  });
}

/* PRELOAD */
function preloadNext(){
  let link = document.createElement("link");
  link.rel="preconnect";
  link.href="https://www.youtube.com";
  document.head.appendChild(link);
}

function next(){
  preloadNext();
  startIndex=(startIndex+visibleCount)%videos.length;
  render();
}

function changeTheme(){
  let color = colorPicker.value;
  document.documentElement.style.setProperty("--theme", color);
}

function updateTimer(){
  delay=parseInt(timerSelect.value);
  if(rotating){
    clearInterval(interval);
    interval=setInterval(next,delay);
  }
}

function toggleRotate(){
  rotating=!rotating;
  clearInterval(interval);

  if(rotating){
    interval=setInterval(next,delay);
    rotateBtn.classList.add("active");
  }else{
    rotateBtn.classList.remove("active");
  }
}

render();
</script>
