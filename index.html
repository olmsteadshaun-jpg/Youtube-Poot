<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<title>PootTubeLive</title>

<link href="https://fonts.googleapis.com/css2?family=UnifrakturMaguntia&display=swap" rel="stylesheet">

<style>
:root{
  --red:#ff1a1a;
}

body{
  margin:0;
  background:#000;
  font-family:Segoe UI;
  color:white;
}

/* HEADER */
.top{
  display:flex;
  justify-content:space-between;
  align-items:center;
  padding:14px 20px;
  border-bottom:1px solid #220000;
  position:relative;
}

/* TITLE */
.title{
  position:absolute;
  left:50%;
  transform:translateX(-50%);
  font-size:70px;
  font-family:'UnifrakturMaguntia', cursive;
  color:#ff2d2d;

  text-shadow:
    0 0 5px #ff0000,
    0 0 15px #ff0000,
    0 0 30px #ff0000,
    0 0 60px #ff0000;
}

/* INPUT */
input{
  background:#0a0a0a;
  border:2px solid #300;
  padding:12px;
  color:white;
  border-radius:8px;
}

/* 🔥 BUTTONS UPGRADED */
button, select{
  background:#0a0a0a;
  border:2px solid #400;
  color:white;

  padding:12px 18px;
  font-size:14px;
  border-radius:8px;

  cursor:pointer;
  transition:0.2s;
}

/* HOVER */
button:hover, select:hover{
  border-color:#ff1a1a;
  box-shadow:
    0 0 6px #ff1a1a,
    0 0 12px rgba(255,0,0,0.6);
  background:#111;
}

/* ADD BUTTON POP */
.left button{
  border-color:#ff1a1a;
  font-weight:600;
}

/* ROTATE BUTTON */
#rotateBtn{
  padding:12px 22px;
  font-size:16px;
  border:2px solid #ff1a1a;
}

/* ACTIVE ROTATE */
#rotateBtn.active{
  background:#ff1a1a;
  color:black;
  box-shadow:0 0 12px #ff1a1a;
}

/* GRID */
.grid{
  display:grid;
  grid-template-columns:repeat(3,1fr);
  gap:12px;
  padding:12px;
}

/* CARD */
.card{
  position:relative;
  border:1px solid #400;
  border-radius:8px;
  overflow:hidden;
  background:#000;
  transition:0.2s;
}

.card:hover{
  border-color:#ff1a1a;
  box-shadow:0 0 12px #ff1a1a;
}

/* VIDEO */
iframe{
  width:100%;
  height:220px;
  border:none;
}

/* INFO */
.info{
  padding:8px;
  font-size:13px;
  background:#050505;
  border-top:1px solid #200;
}

/* CLOSE */
.close{
  position:absolute;
  top:6px;
  right:6px;
  background:#000;
  border:1px solid #400;
  color:white;
  cursor:pointer;
}
</style>
</head>

<body>

<div class="top">

  <div class="left">
    <input id="input" placeholder="Paste YouTube link">
    <button onclick="add()">Add</button>
  </div>

  <div class="title">Poot Tube</div>

  <div class="right">
    <select id="timerSelect">
      <option>120s</option>
      <option>180s</option>
      <option>240s</option>
    </select>

    <button id="rotateBtn" onclick="rotate()">▶</button>
  </div>

</div>

<div id="grid" class="grid"></div>

<script>
let videos = [];

function extractId(input){
  if(input.includes("watch?v=")){
    return input.split("v=")[1].split("&")[0];
  }
  if(input.includes("youtu.be/")){
    return input.split("youtu.be/")[1];
  }
  return input;
}

function add(){
  let val = document.getElementById("input").value.trim();
  if(!val) return;

  let id = extractId(val);
  videos.push(id);
  render();

  document.getElementById("input").value="";
}

function remove(i){
  videos.splice(i,1);
  render();
}

function render(){
  let grid = document.getElementById("grid");
  grid.innerHTML="";

  videos.forEach((id,i)=>{
    let div = document.createElement("div");
    div.className="card";

    div.innerHTML = `
      <button class="close" onclick="remove(${i})">✖</button>

      <iframe
        src="https://www.youtube.com/embed/${id}?autoplay=1&mute=1&loop=1&playlist=${id}">
      </iframe>

      <div class="info">YouTube Video</div>
    `;

    grid.appendChild(div);
  });
}

/* ROTATE */
function rotate(){
  document.getElementById("rotateBtn").classList.toggle("active");

  setInterval(()=>{
    render();
  },60000);
}
</script>

</body>
</html>
