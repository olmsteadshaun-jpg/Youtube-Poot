<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<title>PootTube</title>

<style>
*{box-sizing:border-box;}

body{
  margin:0;
  font-family:Segoe UI, sans-serif;
  background: radial-gradient(circle at top,#0f172a,#020617);
  color:white;
  overflow-x:hidden;
}

/* HEADER */
.top{
  position:sticky;
  top:0;
  z-index:10;
  backdrop-filter: blur(14px);
  background:rgba(2,6,23,0.85);
  padding:14px;
  display:flex;
  gap:10px;
  align-items:center;
  border-bottom:1px solid rgba(255,255,255,0.05);
}

/* TITLE */
.title{
  position:absolute;
  left:50%;
  transform:translateX(-50%);
  font-size:26px;
  font-weight:900;
  letter-spacing:2px;
  color:#ff2d2d;

  animation: neon 2s infinite alternate;
}

@keyframes neon{
  from{
    text-shadow:0 0 5px #ff2d2d,0 0 10px #ff2d2d;
  }
  to{
    text-shadow:0 0 10px #ff0000,0 0 30px #ff0000,0 0 50px #ff0000;
  }
}

/* INPUT */
input{
  padding:10px 12px;
  border-radius:8px;
  border:none;
  flex:1;
  background:#111827;
  color:white;
}

/* BUTTONS */
button, select{
  padding:10px 12px;
  border-radius:8px;
  border:none;
  cursor:pointer;
  color:white;
  background:#1f2937;
  transition:0.25s;
}

button:hover{
  transform:translateY(-1px);
  background:#374151;
}

/* ROTATE BUTTON */
#rotateBtn{
  background:#2563eb;
}

#rotateBtn.active{
  background:#22c55e;
  box-shadow:0 0 15px rgba(34,197,94,0.7);
  animation:pulse 1.5s infinite;
}

@keyframes pulse{
  0%{box-shadow:0 0 5px rgba(34,197,94,0.4);}
  50%{box-shadow:0 0 20px rgba(34,197,94,1);}
  100%{box-shadow:0 0 5px rgba(34,197,94,0.4);}
}

/* GRID */
.grid{
  display:grid;
  grid-template-columns: repeat(auto-fit, minmax(280px, 1fr));
  gap:20px;
  padding:20px;
}

/* CARD */
.card{
  border-radius:12px;
  overflow:hidden;
  background:linear-gradient(145deg,#3b0000,#120000);
  box-shadow:
    0 10px 30px rgba(0,0,0,0.7),
    inset 0 0 15px rgba(255,0,0,0.2);

  transition:0.3s;
}

.card:hover{
  transform:scale(1.03);
  box-shadow:
    0 15px 50px rgba(0,0,0,0.9),
    inset 0 0 25px rgba(255,0,0,0.4);
}

/* VIDEO */
iframe{
  width:100%;
  height:200px;
  border:none;
}
</style>
</head>

<body>

<div class="top">
  <input id="input" placeholder="Paste YouTube video link or ID">
  <button onclick="add()">Add</button>

  <select id="gridSize" onchange="changeGrid()">
    <option value="4">4 Grid</option>
    <option value="6">6 Grid</option>
    <option value="9">9 Grid</option>
  </select>

  <select id="timerSelect" onchange="updateTimer()">
    <option value="120000">120s</option>
    <option value="180000">180s</option>
    <option value="240000">240s</option>
  </select>

  <button id="rotateBtn" onclick="toggleRotate()">Rotate ▶</button>

  <div class="title">POOT TUBE</div>
</div>

<div id="grid" class="grid"></div>

<script>
let videos = JSON.parse(localStorage.getItem("videos") || "[]");

let startIndex = 0;
let visibleCount = 4;

let interval = null;
let delay = 120000;
let rotating = false;

function save(){
  localStorage.setItem("videos", JSON.stringify(videos));
}

function extractId(input){
  if(input.includes("watch?v=")){
    return input.split("v=")[1].split("&")[0];
  }
  if(input.includes("youtu.be/")){
    return input.split("youtu.be/")[1];
  }
  return input;
}

function isValid(id){
  return id.length === 11;
}

function add(){
  let val = document.getElementById("input").value.trim();
  if(!val) return;

  let id = extractId(val);

  if(!isValid(id)){
    alert("Paste a valid video link");
    return;
  }

  if(videos.includes(id)) return;

  videos.push(id);
  save();
  render();

  document.getElementById("input").value = "";
}

function render(){
  let grid = document.getElementById("grid");
  grid.innerHTML = "";

  if(videos.length === 0) return;

  for(let i = 0; i < visibleCount; i++){
    let index = (startIndex + i) % videos.length;
    let id = videos[index];

    let card = document.createElement("div");
    card.className = "card";

    let iframe = document.createElement("iframe");
    iframe.src =
      "https://www.youtube.com/embed/" + id +
      "?autoplay=1&mute=1&loop=1&playlist=" + id;

    card.appendChild(iframe);
    grid.appendChild(card);
  }
}

function next(){
  if(videos.length === 0) return;

  startIndex = (startIndex + visibleCount) % videos.length;
  render();
}

function changeGrid(){
  visibleCount = parseInt(document.getElementById("gridSize").value);
  render();
}

function updateTimer(){
  delay = parseInt(document.getElementById("timerSelect").value);

  if(rotating){
    clearInterval(interval);
    interval = setInterval(next, delay);
  }
}

function toggleRotate(){
  let btn = document.getElementById("rotateBtn");

  if(videos.length <= visibleCount){
    alert("Add more videos to rotate");
    return;
  }

  rotating = !rotating;

  clearInterval(interval);

  if(rotating){
    interval = setInterval(next, delay);
    btn.classList.add("active");
  } else {
    btn.classList.remove("active");
  }
}

render();
</script>

</body>
</html>
