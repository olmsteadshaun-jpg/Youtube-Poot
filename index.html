<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<title>PootTube</title>

<link href="https://fonts.googleapis.com/css2?family=UnifrakturCook:wght@700&display=swap" rel="stylesheet">

<style>
*{box-sizing:border-box;}

body{
  margin:0;
  font-family:Segoe UI, sans-serif;
  background:#000;
  color:white;
}

/* HEADER */
.top{
  position:sticky;
  top:0;
  display:flex;
  justify-content:space-between;
  align-items:center;
  padding:14px 20px;
  background:rgba(0,0,0,0.9);
}

/* TITLE */
.title{
  position:absolute;
  left:50%;
  transform:translateX(-50%);
  font-family:'UnifrakturCook', cursive;
  font-size:56px;
  color:#ff2d2d;
  animation: glow 2s infinite alternate;
}

@keyframes glow{
  from{ text-shadow:0 0 10px #ff2d2d; }
  to{ text-shadow:0 0 30px #ff0000,0 0 60px #ff0000; }
}

/* INPUT */
input{
  padding:10px;
  border-radius:8px;
  border:none;
  background:#111;
  color:white;
}

/* BUTTONS */
button, select{
  padding:10px;
  border-radius:8px;
  border:none;
  background:#1f2937;
  color:white;
  cursor:pointer;
}

#rotateBtn.active{
  background:#ff2d2d;
}

/* GRID */
.grid{
  display:grid;
  gap:16px;
  padding:16px;
  height:calc(100vh - 80px);
}

.grid.grid-4{ grid-template-columns:repeat(2,1fr); }
.grid.grid-6{ grid-template-columns:repeat(3,1fr); }
.grid.grid-9{ grid-template-columns:repeat(3,1fr); }

/* CARD */
.card{
  position:relative;
  border-radius:10px;
  overflow:hidden;
  cursor:pointer;
  border:2px solid var(--borderColor, #ff2d2d);
  animation:borderGlow 3s infinite linear;
}

@keyframes borderGlow{
  0%{box-shadow:0 0 5px var(--borderColor);}
  50%{box-shadow:0 0 20px var(--borderColor);}
  100%{box-shadow:0 0 5px var(--borderColor);}
}

/* THUMB */
.thumb{
  width:100%;
  height:100%;
  object-fit:cover;
}

/* TITLE TEXT */
.videoTitle{
  position:absolute;
  bottom:0;
  width:100%;
  padding:8px;
  background:linear-gradient(to top,rgba(0,0,0,0.8),transparent);
  font-size:14px;
}

/* IFRAME */
iframe{
  width:100%;
  height:100%;
  border:none;
}

/* CLOSE */
.close{
  position:absolute;
  top:6px;
  right:6px;
  background:black;
  color:white;
  border:none;
  padding:4px 8px;
  cursor:pointer;
}
</style>
</head>

<body>

<div class="top">

  <!-- LEFT -->
  <div>
    <input id="input" placeholder="Paste video link or ID">
    <button onclick="add()">Add</button>
  </div>

  <!-- CENTER TITLE -->
  <div class="title">POOT TUBE</div>

  <!-- RIGHT -->
  <div>
    <select id="gridSize" onchange="changeGrid()">
      <option value="4">4</option>
      <option value="6">6</option>
      <option value="9">9</option>
    </select>

    <select id="timerSelect" onchange="updateTimer()">
      <option value="120000">120s</option>
      <option value="180000">180s</option>
      <option value="240000">240s</option>
    </select>

    <!-- 🎨 COLOR PICKER -->
    <input type="color" id="colorPicker" value="#ff2d2d" onchange="changeColor()">

    <button id="rotateBtn" onclick="toggleRotate()">▶</button>
  </div>

</div>

<div id="grid" class="grid grid-4"></div>

<script>
let videos = JSON.parse(localStorage.getItem("videos") || "[]");

let startIndex = 0;
let visibleCount = 4;
let delay = 120000;
let interval = null;
let rotating = false;
let borderColor = "#ff2d2d";

function save(){
  localStorage.setItem("videos", JSON.stringify(videos));
}

function extractId(input){
  if(input.includes("watch?v=")){
    return input.split("v=")[1].split("&")[0];
  }
  if(input.includes("youtu.be/")){
    return input.split("youtu.be/")[1];
  }
  return input;
}

function add(){
  let val = input.value.trim();
  if(!val) return;

  let id = extractId(val);
  if(id.length !== 11) return alert("Invalid video");

  if(videos.includes(id)) return;

  videos.push(id);
  save();
  render();
  input.value="";
}

function remove(index){
  videos.splice(index,1);
  save();
  render();
}

function render(){
  let grid = document.getElementById("grid");
  grid.innerHTML="";

  if(videos.length === 0) return;

  for(let i=0;i<visibleCount;i++){
    let index=(startIndex+i)%videos.length;
    let id=videos[index];

    let card=document.createElement("div");
    card.className="card";
    card.style.setProperty("--borderColor", borderColor);

    let thumb=document.createElement("img");
    thumb.src=`https://img.youtube.com/vi/${id}/hqdefault.jpg`;
    thumb.className="thumb";

    let title=document.createElement("div");
    title.className="videoTitle";
    title.innerText="Video ID: "+id;

    let close=document.createElement("button");
    close.className="close";
    close.innerText="✖";
    close.onclick=(e)=>{
      e.stopPropagation();
      remove(index);
    };

    card.onclick=()=>{
      card.innerHTML="";
      let iframe=document.createElement("iframe");
      iframe.src=`https://www.youtube.com/embed/${id}?autoplay=1&mute=1&loop=1&playlist=${id}`;
      card.appendChild(iframe);
    };

    card.appendChild(close);
    card.appendChild(thumb);
    card.appendChild(title);
    grid.appendChild(card);
  }
}

function changeGrid(){
  visibleCount=parseInt(gridSize.value);
  grid.className="grid grid-"+visibleCount;
  render();
}

function changeColor(){
  borderColor = document.getElementById("colorPicker").value;
  render();
}

function next(){
  startIndex=(startIndex+visibleCount)%videos.length;
  render();
}

function updateTimer(){
  delay=parseInt(timerSelect.value);
  if(rotating){
    clearInterval(interval);
    interval=setInterval(next,delay);
  }
}

function toggleRotate(){
  rotating=!rotating;
  clearInterval(interval);

  if(rotating){
    interval=setInterval(next,delay);
    rotateBtn.classList.add("active");
  }else{
    rotateBtn.classList.remove("active");
  }
}

render();
</script>

</body>
</html>
