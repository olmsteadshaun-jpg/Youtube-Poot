<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<title>PootTubeLive</title>

<link href="https://fonts.googleapis.com/css2?family=UnifrakturMaguntia&display=swap" rel="stylesheet">

<style>
body{
  margin:0;
  background:black;
  font-family:Segoe UI;
  color:white;
}

/* HEADER */
.top{
  display:flex;
  justify-content:space-between;
  align-items:center;
  padding:20px;
  position:relative;
}

/* 🔥 MASSIVE MEDIEVAL TITLE */
.title{
  position:absolute;
  left:50%;
  transform:translateX(-50%);

  font-size:110px; /* ← BIG so you KNOW it changed */

  font-family:'UnifrakturMaguntia', cursive !important;

  color:gold;

  text-shadow:
    0 0 5px red,
    0 0 20px red,
    0 0 40px darkred,
    0 0 80px red;
}

/* 🔴 INPUT + BUTTONS VERY OBVIOUS */
input{
  padding:14px;
  border:4px solid red; /* THICK */
  background:black;
  color:white;
}

/* BUTTONS */
button, select{
  padding:14px 22px;
  font-size:16px;

  border:4px solid red; /* VERY THICK */
  background:black;
  color:white;

  cursor:pointer;
}

/* HOVER */
button:hover{
  background:red;
  color:black;
}

/* GRID */
.grid{
  display:grid;
  grid-template-columns:repeat(3,1fr);
  gap:10px;
  padding:10px;
}

/* CARD */
.card{
  border:2px solid red;
}

/* VIDEO */
iframe{
  width:100%;
  height:220px;
  border:none;
}
</style>
</head>

<body>

<div class="top">

  <div>
    <input id="input" placeholder="Paste YouTube link">
    <button onclick="add()">Add</button>
  </div>

  <div class="title">Poot Tube</div>

  <div>
    <button onclick="rotate()">▶</button>
  </div>

</div>

<div id="grid" class="grid"></div>

<script>
let videos=[];

function extractId(input){
  if(input.includes("watch?v=")){
    return input.split("v=")[1].split("&")[0];
  }
  if(input.includes("youtu.be/")){
    return input.split("youtu.be/")[1];
  }
  return input;
}

function add(){
  let val=document.getElementById("input").value.trim();
  if(!val)return;

  let id=extractId(val);
  videos.push(id);
  render();
}

function render(){
  let grid=document.getElementById("grid");
  grid.innerHTML="";

  videos.forEach(id=>{
    grid.innerHTML+=`
      <div class="card">
        <iframe src="https://www.youtube.com/embed/${id}?autoplay=1&mute=1"></iframe>
      </div>
    `;
  });
}

function rotate(){
  setInterval(render,60000);
}
</script>

</body>
</html>
