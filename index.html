<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<title>PootiLurk</title>

<style>
body{
  margin:0;
  font-family:Segoe UI;
  background:#0b1220;
  color:white;
  display:flex;
  justify-content:center;
  align-items:center;
  height:100vh;
}
.box{
  background:#020617;
  padding:20px;
  border-radius:10px;
  width:420px;
}
input{
  width:100%;
  padding:10px;
  margin-bottom:10px;
}
button{
  width:100%;
  padding:10px;
  background:#2563eb;
  color:white;
  border:none;
  margin-bottom:10px;
  cursor:pointer;
}
.list{
  max-height:120px;
  overflow-y:auto;
  margin-bottom:10px;
}
.item{
  background:#111827;
  padding:8px;
  margin-bottom:5px;
  cursor:pointer;
}
iframe{
  width:100%;
  height:250px;
  border:none;
}
</style>
</head>

<body>

<div class="box">

  <h2>PootiLurk</h2>

  <input id="input" placeholder="Paste YouTube link or ID">

  <button onclick="add()">Add Video</button>

  <div class="list" id="list"></div>

  <button onclick="next()">Next ▶</button>

  <iframe id="player"></iframe>

</div>

<script>
let videos = JSON.parse(localStorage.getItem("videos") || "[]");
let current = 0;

function save(){
  localStorage.setItem("videos", JSON.stringify(videos));
}

function extractId(input){
  let id = input;

  if(input.includes("watch?v=")){
    id = input.split("v=")[1];
    if(id.includes("&")) id = id.split("&")[0];
  }

  if(input.includes("youtu.be/")){
    id = input.split("youtu.be/")[1];
  }

  return id;
}

function add(){
  let val = document.getElementById("input").value.trim();
  if(!val) return;

  let id = extractId(val);
  videos.push(id);

  save();
  render();

  document.getElementById("input").value = "";
}

function render(){
  let list = document.getElementById("list");
  list.innerHTML = "";

  videos.forEach((v,i)=>{
    let d = document.createElement("div");
    d.className = "item";
    d.innerText = v;
    d.onclick = ()=>{
      current = i;
      play(v);
    };
    list.appendChild(d);
  });
}

function play(id){
  document.getElementById("player").src =
    "https://www.youtube.com/embed/" + id + "?autoplay=1&mute=1";
}

function next(){
  if(videos.length === 0) return;

  current++;
  if(current >= videos.length) current = 0;

  play(videos[current]);
}

// optional auto rotate every 60s
setInterval(()=>{
  if(videos.length > 1){
    next();
  }
}, 60000);

render();
</script>

</body>
</html>
