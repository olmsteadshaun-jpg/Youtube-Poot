<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<title>PootTubeLive</title>

<link href="https://fonts.googleapis.com/css2?family=UnifrakturMaguntia&display=swap" rel="stylesheet">

<style>
:root{ --theme:#ff0000; }

*{box-sizing:border-box;}

body{
  margin:0;
  font-family:Segoe UI, sans-serif;
  color:white;

  /* 🖤 PURE BLACK BACKGROUND */
  background:#000;
}

/* HEADER */
.top{
  position:sticky;
  top:0;
  display:flex;
  justify-content:space-between;
  align-items:center;
  padding:16px 24px;
  background:rgba(0,0,0,0.85);
}

.left,.right{
  display:flex;
  gap:10px;
  align-items:center;
}

/* TITLE */
.title{
  position:absolute;
  left:50%;
  transform:translateX(-50%);
  font-size:85px;
  font-family:'UnifrakturMaguntia', cursive;
  color:var(--theme);
  letter-spacing:4px;

  text-shadow:
    0 0 8px var(--theme),
    0 0 20px var(--theme),
    0 0 40px var(--theme),
    0 0 80px var(--theme);
}

/* INPUT */
input{
  padding:10px;
  border-radius:8px;
  border:2px solid var(--theme);
  background:#111;
  color:white;
}

/* BUTTONS */
button, select{
  padding:10px 16px;
  border-radius:8px;
  background:#111;
  color:white;
  border:2px solid var(--theme);
  cursor:pointer;
  transition:0.2s;
}

button:hover, select:hover{
  box-shadow:0 0 10px var(--theme);
  background:#1a1a1a;
}

#rotateBtn.active{
  background:var(--theme);
  color:black;
}

/* GRID */
.grid{
  display:grid;
  grid-template-columns:repeat(3,1fr);
  gap:12px;
  padding:12px;
  height:calc(100vh - 80px);
}

/* CARD */
.card{
  position:relative;
  border-radius:10px;
  overflow:hidden;
  border:1px solid rgba(255,255,255,0.1);
  transition:0.2s;
}

.card:hover{
  border-color:var(--theme);
  box-shadow:0 0 12px var(--theme);
}

.card.active{
  box-shadow:
    0 0 10px var(--theme),
    0 0 25px var(--theme);
}

/* VIDEO */
iframe{
  width:100%;
  height:100%;
  border:none;
}

/* CLOSE */
.close{
  position:absolute;
  top:4px;
  right:4px;
  background:black;
  border:1px solid var(--theme);
  color:white;
  padding:2px 6px;
  cursor:pointer;
}
</style>
</head>

<body>

<div class="top">

  <div class="left">
    <input id="input" placeholder="Paste YouTube link">
    <button onclick="add()">Add</button>
  </div>

  <div class="title">Poot Tube</div>

  <div class="right">

    <!-- GRID SIZE -->
    <select onchange="changeGrid(this.value)">
      <option value="3">3</option>
      <option value="6">6</option>
      <option value="9" selected>9</option>
    </select>

    <!-- TIMER -->
    <select id="timerSelect" onchange="updateTimer()">
      <option value="120000">120s</option>
      <option value="180000">180s</option>
      <option value="240000">240s</option>
    </select>

    <!-- COLOR PICKER -->
    <input type="color" id="colorPicker" value="#ff0000" onchange="changeTheme()">

    <button id="rotateBtn" onclick="toggleRotate()">▶</button>
  </div>

</div>

<div id="grid" class="grid"></div>

<script>
let videos = JSON.parse(localStorage.getItem("videos") || "[]");

let startIndex = 0;
let visibleCount = 9;
let delay = 120000;
let interval = null;
let rotating = false;

let activeAudio = 0;

/* SAVE */
function save(){
  localStorage.setItem("videos", JSON.stringify(videos));
}

/* GRID SIZE */
function changeGrid(val){
  visibleCount = parseInt(val);
  render();
}

/* COLOR */
function changeTheme(){
  const color = document.getElementById("colorPicker").value;
  document.documentElement.style.setProperty("--theme", color);
}

/* EXTRACT */
function extractId(input){
  if(input.includes("watch?v=")){
    return input.split("v=")[1].split("&")[0];
  }
  if(input.includes("youtu.be/")){
    return input.split("youtu.be/")[1];
  }
  return input;
}

/* ADD */
function add(){
  let val = document.getElementById("input").value.trim();
  if(!val) return;

  let id = extractId(val);
  if(id.length !== 11) return;

  if(videos.includes(id)) return;

  videos.push(id);
  save();
  render();

  document.getElementById("input").value="";
}

/* REMOVE */
function remove(index){
  videos.splice(index,1);
  save();
  render();
}

/* RENDER */
function render(){
  let grid = document.getElementById("grid");
  grid.innerHTML="";

  if(videos.length === 0) return;

  for(let i=0;i<visibleCount;i++){
    let index=(startIndex+i)%videos.length;
    let id=videos[index];

    let card=document.createElement("div");
    card.className="card";

    if(index===activeAudio) card.classList.add("active");

    let iframe=document.createElement("iframe");
    iframe.src=`https://www.youtube.com/embed/${id}?autoplay=1&mute=${index===activeAudio?0:1}&loop=1&playlist=${id}`;
    iframe.allow="autoplay";

    let close=document.createElement("button");
    close.className="close";
    close.innerText="✖";
    close.onclick=(e)=>{e.stopPropagation(); remove(index);};

    card.onclick=()=>{activeAudio=index; render();};

    card.append(close,iframe);
    grid.appendChild(card);
  }
}

/* ROTATE */
function next(){
  startIndex=(startIndex+visibleCount)%videos.length;
  render();
}

function updateTimer(){
  delay=parseInt(document.getElementById("timerSelect").value);
  if(rotating){
    clearInterval(interval);
    interval=setInterval(next,delay);
  }
}

function toggleRotate(){
  rotating=!rotating;
  clearInterval(interval);

  let btn=document.getElementById("rotateBtn");

  if(rotating){
    interval=setInterval(next,delay);
    btn.classList.add("active");
  }else{
    btn.classList.remove("active");
  }
}

render();
</script>

</body>
</html>
