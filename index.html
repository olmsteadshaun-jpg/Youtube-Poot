<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<title>PootiLurk</title>

<style>
body{
  margin:0;
  font-family:Segoe UI;
  background:#0b1220;
  color:white;
}

.top{
  padding:10px;
  background:#020617;
  display:flex;
  gap:10px;
}

input{
  padding:10px;
  flex:1;
}

button{
  padding:10px;
  background:#2563eb;
  color:white;
  border:none;
  cursor:pointer;
}

.grid{
  display:grid;
  grid-template-columns: repeat(auto-fit, minmax(300px, 1fr));
  gap:10px;
  padding:10px;
}

.player{
  background:black;
  position:relative;
}

iframe{
  width:100%;
  height:200px;
  border:none;
}

.controls{
  position:absolute;
  top:5px;
  right:5px;
  display:flex;
  gap:5px;
}

.small{
  padding:4px;
  font-size:12px;
}
</style>
</head>

<body>

<div class="top">
  <input id="input" placeholder="Paste YouTube link or ID">
  <button onclick="add()">Add</button>
  <button onclick="rotate()">Rotate ▶</button>
</div>

<div id="grid" class="grid"></div>

<script>
let videos = JSON.parse(localStorage.getItem("videos") || "[]");

function save(){
  localStorage.setItem("videos", JSON.stringify(videos));
}

function extractId(input){
  let id = input;

  if(input.includes("watch?v=")){
    id = input.split("v=")[1];
    if(id.includes("&")) id = id.split("&")[0];
  }

  if(input.includes("youtu.be/")){
    id = input.split("youtu.be/")[1];
  }

  return id;
}

function add(){
  let val = document.getElementById("input").value.trim();
  if(!val) return;

  let id = extractId(val);
  videos.push({ id, muted:true });

  save();
  render();

  document.getElementById("input").value = "";
}

function remove(index){
  videos.splice(index,1);
  save();
  render();
}

function toggleMute(index){
  videos[index].muted = !videos[index].muted;
  render();
}

function render(){
  let grid = document.getElementById("grid");
  grid.innerHTML = "";

  videos.forEach((v,i)=>{
    let div = document.createElement("div");
    div.className = "player";

    div.innerHTML = `
      <div class="controls">
        <button class="small" onclick="toggleMute(${i})">
          ${v.muted ? "🔇" : "🔊"}
        </button>
        <button class="small" onclick="remove(${i})">❌</button>
      </div>

      <iframe
        src="https://www.youtube.com/embed/${v.id}?autoplay=1&mute=${v.muted ? 1 : 0}"
        allow="autoplay">
      </iframe>
    `;

    grid.appendChild(div);
  });
}

// auto rotate (rebuild players every 60 sec)
function rotate(){
  setInterval(()=>{
    render();
  }, 60000);
}

render();
</script>

</body>
</html>
