<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<title>PootiLurk</title>

<style>
body{
  margin:0;
  font-family:Segoe UI;
  background:#0b1220;
  color:white;
}

.top{
  padding:10px;
  background:#020617;
  display:flex;
  gap:10px;
}

input{
  padding:10px;
  flex:1;
}

button{
  padding:10px;
  background:#2563eb;
  color:white;
  border:none;
  cursor:pointer;
}

.container{
  display:flex;
  height:calc(100vh - 60px);
}

.sidebar{
  width:260px;
  background:#020617;
  overflow-y:auto;
  padding:10px;
}

.item{
  background:#111827;
  padding:8px;
  margin-bottom:5px;
  cursor:pointer;
}

.active{
  outline:2px solid #22c55e;
}

.main{
  flex:1;
}

iframe{
  width:100%;
  height:100%;
  border:none;
}
</style>
</head>

<body>

<div class="top">
  <input id="input" placeholder="Paste YouTube link or ID">
  <button onclick="add()">Add</button>
  <button onclick="toggleRotate()">Rotate ▶</button>
</div>

<div class="container">
  <div id="list" class="sidebar"></div>
  <div class="main">
    <iframe id="player"></iframe>
  </div>
</div>

<script>
let videos = JSON.parse(localStorage.getItem("videos") || "[]");
let current = 0;
let rotating = false;
let interval = null;

function save(){
  localStorage.setItem("videos", JSON.stringify(videos));
}

function extractId(input){
  if(input.includes("watch?v=")){
    return input.split("v=")[1].split("&")[0];
  }
  if(input.includes("youtu.be/")){
    return input.split("youtu.be/")[1];
  }
  return input;
}

function add(){
  let val = document.getElementById("input").value.trim();
  if(!val) return;

  let id = extractId(val);

  if(videos.includes(id)) return;

  videos.push(id);
  save();
  render();

  document.getElementById("input").value = "";
}

function remove(index){
  videos.splice(index,1);
  save();
  render();
}

function play(index){
  current = index;
  loadPlayer();
  render();
}

function loadPlayer(){
  if(videos.length === 0) return;

  let id = videos[current];

  document.getElementById("player").src =
    "https://www.youtube.com/embed/" + id +
    "?autoplay=1&mute=1&loop=1&playlist=" + id;
}

function render(){
  let list = document.getElementById("list");
  list.innerHTML = "";

  videos.forEach((v,i)=>{
    let d = document.createElement("div");
    d.className = "item " + (i === current ? "active" : "");
    d.innerText = v;

    d.onclick = ()=>play(i);

    let del = document.createElement("span");
    del.innerText = " ❌";
    del.style.float = "right";
    del.onclick = (e)=>{
      e.stopPropagation();
      remove(i);
    };

    d.appendChild(del);
    list.appendChild(d);
  });
}

function next(){
  if(videos.length === 0) return;

  current = (current + 1) % videos.length;
  loadPlayer();
  render();
}

function toggleRotate(){
  rotating = !rotating;

  if(rotating){
    interval = setInterval(next, 30000); // 30 sec
  } else {
    clearInterval(interval);
  }
}

// init
if(videos.length > 0){
  loadPlayer();
}
render();
</script>

</body>
</html>
