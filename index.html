<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<title>PootTubeLive</title>

<link href="https://fonts.googleapis.com/css2?family=UnifrakturMaguntia&display=swap" rel="stylesheet">

<style>
:root{ --theme:#ff0000; }

*{box-sizing:border-box;}

body{
  margin:0;
  font-family:Segoe UI, sans-serif;
  color:white;
  background:#000;
}

/* HEADER */
.top{
  position:sticky;
  top:0;
  display:flex;
  justify-content:space-between;
  align-items:center;
  padding:16px 24px;
  background:rgba(0,0,0,0.9);
}

.left,.right{
  display:flex;
  gap:10px;
  align-items:center;
}

/* TITLE */
.title{
  position:absolute;
  left:50%;
  transform:translateX(-50%);
  font-size:85px;
  font-family:'UnifrakturMaguntia', cursive;
  color:var(--theme);
  text-shadow:
    0 0 8px var(--theme),
    0 0 20px var(--theme),
    0 0 40px var(--theme);
}

/* INPUT */
input{
  padding:10px;
  border-radius:8px;
  border:2px solid var(--theme);
  background:#111;
  color:white;
}

/* BUTTONS */
button, select{
  padding:10px 16px;
  border-radius:8px;
  background:#111;
  color:white;
  border:2px solid var(--theme);
  cursor:pointer;
}

button:hover{
  box-shadow:0 0 10px var(--theme);
}

/* GRID */
.grid{
  display:grid;
  grid-template-columns:repeat(3,1fr);
  gap:12px;
  padding:12px;
  height:calc(100vh - 120px);
}

/* CARD */
.card{
  position:relative;
  border-radius:10px;
  overflow:hidden;
}

.card.active{
  box-shadow:0 0 15px var(--theme);
}

iframe{
  width:100%;
  height:100%;
  border:none;
}

.close{
  position:absolute;
  top:5px;
  right:5px;
  background:black;
  border:1px solid var(--theme);
  color:white;
  cursor:pointer;
}

/* FOOTER */
.footer{
  text-align:center;
  padding:10px;
  font-size:12px;
  border-top:1px solid #222;
}

.footer a{
  color:var(--theme);
  margin:0 10px;
  cursor:pointer;
}

/* MODAL */
.modal{
  display:none;
  position:fixed;
  top:0;
  left:0;
  width:100%;
  height:100%;
  background:rgba(0,0,0,0.9);
  justify-content:center;
  align-items:center;
}

.modal-content{
  background:#111;
  padding:20px;
  max-width:600px;
  border:1px solid var(--theme);
}
</style>
</head>

<body>

<div class="top">
  <div class="left">
    <input id="input" placeholder="Paste YouTube link">
    <button onclick="add()">Add</button>
  </div>

  <div class="title">Poot Tube</div>

  <div class="right">
    <select onchange="changeGrid(this.value)">
      <option value="3">3</option>
      <option value="6">6</option>
      <option value="9" selected>9</option>
    </select>

    <input type="color" id="colorPicker" value="#ff0000" onchange="changeTheme()">

    <button onclick="toggleRotate()">▶</button>
  </div>
</div>

<div id="grid" class="grid"></div>

<!-- FOOTER -->
<div class="footer">
  <a onclick="openModal('about')">About</a>
  <a onclick="openModal('privacy')">Privacy</a>
  <a onclick="openModal('contact')">Contact</a>
</div>

<!-- MODALS -->
<div id="modal" class="modal" onclick="closeModal()">
  <div class="modal-content" id="modalContent"></div>
</div>

<script>
let videos=[];
let visibleCount=9;
let activeAudio=0;
let startIndex=0;
let rotating=false;
let interval;

/* ADD */
function add(){
  let val=input.value.trim();
  if(!val) return;

  let id=val.includes("v=") ? val.split("v=")[1].split("&")[0] : val.split("youtu.be/")[1];
  videos.push(id);
  render();
}

/* GRID */
function changeGrid(val){
  visibleCount=parseInt(val);
  render();
}

/* COLOR */
function changeTheme(){
  document.documentElement.style.setProperty("--theme", colorPicker.value);
}

/* RENDER */
function render(){
  grid.innerHTML="";
  for(let i=0;i<visibleCount;i++){
    let id=videos[(startIndex+i)%videos.length];
    if(!id) continue;

    let card=document.createElement("div");
    card.className="card";

    let iframe=document.createElement("iframe");
    iframe.src=`https://www.youtube.com/embed/${id}?autoplay=1&mute=${i!==activeAudio}&loop=1&playlist=${id}`;

    let close=document.createElement("button");
    close.className="close";
    close.innerText="✖";
    close.onclick=()=>{videos.splice(i,1);render();};

    card.onclick=()=>{activeAudio=i;render();};

    card.append(close,iframe);
    grid.appendChild(card);
  }
}

/* ROTATE */
function toggleRotate(){
  rotating=!rotating;
  clearInterval(interval);

  if(rotating){
    interval=setInterval(()=>{
      startIndex=(startIndex+visibleCount)%videos.length;
      render();
    },120000);
  }
}

/* MODALS */
function openModal(type){
  let content="";
  if(type==="about"){
    content="PootTubeLive is a multi-stream viewer for watching multiple live streams at once.";
  }
  if(type==="privacy"){
    content="We use cookies and third-party services such as Google AdSense.";
  }
  if(type==="contact"){
    content="Contact: support@poottube.live";
  }

  modalContent.innerHTML=content;
  modal.style.display="flex";
}

function closeModal(){
  modal.style.display="none";
}
</script>

</body>
</html>
