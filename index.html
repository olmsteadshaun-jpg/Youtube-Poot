<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<title>PootTube</title>

<link href="https://fonts.googleapis.com/css2?family=UnifrakturCook:wght@700&display=swap" rel="stylesheet">

<style>
*{box-sizing:border-box;}

body{
  margin:0;
  font-family:Segoe UI, sans-serif;
  background:#000000; /* PURE BLACK */
  color:white;
}

/* HEADER */
.top{
  position:sticky;
  top:0;
  display:flex;
  justify-content:space-between;
  align-items:center;
  padding:14px 20px;
  backdrop-filter: blur(14px);
  background:rgba(0,0,0,0.85);
}

/* LEFT */
.left{
  display:flex;
  gap:10px;
  align-items:center;
}

/* RIGHT */
.right{
  display:flex;
  gap:10px;
  align-items:center;
}

/* TITLE */
.title{
  position:absolute;
  left:50%;
  transform:translateX(-50%);
  font-family:'UnifrakturCook', cursive;
  font-size:56px; /* BIGGER */
  color:#ff2d2d;

  animation: glow 2s infinite alternate;
}

@keyframes glow{
  from{
    text-shadow:0 0 10px #ff2d2d, 0 0 20px #ff2d2d;
  }
  to{
    text-shadow:0 0 25px #ff0000, 0 0 50px #ff0000, 0 0 80px #ff0000;
  }
}

/* INPUT */
input{
  padding:10px;
  border-radius:8px;
  border:none;
  background:#111827;
  color:white;
}

/* BUTTONS */
button, select{
  padding:10px;
  border-radius:8px;
  border:none;
  cursor:pointer;
  background:#1f2937;
  color:white;
}

#rotateBtn.active{
  background:#22c55e;
}

/* GRID */
.grid{
  display:grid;
  gap:16px;
  padding:16px;
  height:calc(100vh - 80px);
}

.grid.grid-4{ grid-template-columns:repeat(2,1fr); }
.grid.grid-6{ grid-template-columns:repeat(3,1fr); }
.grid.grid-9{ grid-template-columns:repeat(3,1fr); }

/* CARD */
.card{
  position:relative;
  border-radius:10px;
  overflow:hidden;
  cursor:grab;
  border:3px solid var(--borderColor, red);
  animation:borderGlow 3s infinite linear;
}

@keyframes borderGlow{
  0%{box-shadow:0 0 5px var(--borderColor);}
  50%{box-shadow:0 0 20px var(--borderColor);}
  100%{box-shadow:0 0 5px var(--borderColor);}
}

iframe{
  width:100%;
  height:100%;
  border:none;
}

/* CLOSE BUTTON */
.close{
  position:absolute;
  top:6px;
  right:6px;
  background:black;
  border:none;
  color:white;
  padding:4px 8px;
  cursor:pointer;
}
</style>
</head>

<body>

<div class="top">

  <!-- LEFT -->
  <div class="left">
    <input id="input" placeholder="Paste video link or ID">
    <button onclick="add()">Add</button>
  </div>

  <!-- CENTER TITLE -->
  <div class="title">POOT TUBE</div>

  <!-- RIGHT -->
  <div class="right">
    <select id="gridSize" onchange="changeGrid()">
      <option value="4">4</option>
      <option value="6">6</option>
      <option value="9">9</option>
    </select>

    <select id="timerSelect" onchange="updateTimer()">
      <option value="120000">120s</option>
      <option value="180000">180s</option>
      <option value="240000">240s</option>
    </select>

    <input type="color" id="colorPicker" value="#ff0000" onchange="changeColor()">

    <button id="rotateBtn" onclick="toggleRotate()">▶</button>
  </div>

</div>

<div id="grid" class="grid grid-4"></div>

<script>
let videos = JSON.parse(localStorage.getItem("videos") || "[]");

let startIndex = 0;
let visibleCount = 4;
let delay = 120000;
let interval = null;
let rotating = false;
let borderColor = "#ff0000";

function save(){
  localStorage.setItem("videos", JSON.stringify(videos));
}

function extractId(input){
  if(input.includes("watch?v=")){
    return input.split("v=")[1].split("&")[0];
  }
  if(input.includes("youtu.be/")){
    return input.split("youtu.be/")[1];
  }
  return input;
}

function add(){
  let val = input.value.trim();
  if(!val) return;

  let id = extractId(val);
  if(id.length !== 11) return alert("Invalid video");

  if(videos.includes(id)) return;

  videos.push(id);
  save();
  render();
  input.value="";
}

function remove(index){
  videos.splice(index,1);
  save();
  render();
}

function render(){
  let grid = document.getElementById("grid");
  grid.innerHTML="";

  if(videos.length === 0) return;

  for(let i=0;i<visibleCount;i++){
    let index=(startIndex+i)%videos.length;
    let id=videos[index];

    let card=document.createElement("div");
    card.className="card";
    card.draggable=true;
    card.style.setProperty("--borderColor",borderColor);

    let iframe=document.createElement("iframe");
    iframe.src=`https://www.youtube.com/embed/${id}?autoplay=1&mute=1&loop=1&playlist=${id}`;

    let close=document.createElement("button");
    close.className="close";
    close.innerText="✖";
    close.onclick=()=>remove(index);

    card.appendChild(close);
    card.appendChild(iframe);
    grid.appendChild(card);

    card.ondragstart=e=>{
      e.dataTransfer.setData("index",index);
    };

    card.ondrop=e=>{
      let from=e.dataTransfer.getData("index");
      let temp=videos[from];
      videos[from]=videos[index];
      videos[index]=temp;
      save();
      render();
    };

    card.ondragover=e=>e.preventDefault();
  }
}

function changeGrid(){
  visibleCount=parseInt(gridSize.value);
  grid.className="grid grid-"+visibleCount;
  render();
}

function changeColor(){
  borderColor=colorPicker.value;
  render();
}

function next(){
  startIndex=(startIndex+visibleCount)%videos.length;
  render();
}

function updateTimer(){
  delay=parseInt(timerSelect.value);
  if(rotating){
    clearInterval(interval);
    interval=setInterval(next,delay);
  }
}

function toggleRotate(){
  rotating=!rotating;
  clearInterval(interval);

  if(rotating){
    interval=setInterval(next,delay);
    rotateBtn.classList.add("active");
  }else{
    rotateBtn.classList.remove("active");
  }
}

render();
</script>

</body>
</html>
