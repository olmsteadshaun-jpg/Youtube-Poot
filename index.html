<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<title>PootiLurk</title>

<style>
body{
  margin:0;
  font-family:Segoe UI;
  background:#0b1220;
  color:white;
}
.container{
  display:flex;
  height:100vh;
}
.sidebar{
  width:300px;
  background:#020617;
  padding:15px;
}
.main{
  flex:1;
}
input{
  width:100%;
  padding:8px;
  margin-bottom:10px;
}
button{
  width:100%;
  padding:10px;
  margin-bottom:10px;
  background:#2563eb;
  color:white;
  border:none;
}
.center{
  display:flex;
  justify-content:center;
  align-items:center;
  height:100vh;
}
.box{
  background:#020617;
  padding:30px;
  border-radius:10px;
}
.channel{
  padding:5px;
  background:#111827;
  margin-bottom:5px;
  cursor:pointer;
}
iframe{
  width:100%;
  height:100%;
  border:none;
}
</style>
</head>

<body>

<div id="app"></div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.js"></script>

<script>
const supabase = window.supabase.createClient(
  "https://aujzhgdxnvcdxrjxkrlu.supabase.co",
  "sb_publishable_0X6rYnfD2-NNEy1I5YB6IQ_WxVHfMlF"
);

const app = document.getElementById("app");

// LOGIN VIEW
function showLogin(){
  app.innerHTML = `
    <div class="center">
      <div class="box">
        <h2>PootiLurk</h2>
        <input id="email" placeholder="Email">
        <input id="password" type="password" placeholder="Password">
        <button onclick="signup()">Sign Up</button>
        <button onclick="login()">Login</button>
        <div id="msg"></div>
      </div>
    </div>
  `;
}

// DASHBOARD
function showDashboard(){
  app.innerHTML = `
    <div class="container">
      <div class="sidebar">
        <h3>Channels</h3>
        <input id="channelInput" placeholder="Channel ID">
        <button onclick="addChannel()">Add</button>
        <div id="channels"></div>
        <button onclick="logout()">Logout</button>
      </div>
      <div class="main">
        <iframe id="player"></iframe>
      </div>
    </div>
  `;
  loadChannels();
}

// AUTH
async function signup(){
  const { error } = await supabase.auth.signUp({
    email: email.value,
    password: password.value
  });
  document.getElementById("msg").innerText = error ? error.message : "Signup OK";
}

async function login(){
  const { error } = await supabase.auth.signInWithPassword({
    email: email.value,
    password: password.value
  });

  if(error){
    document.getElementById("msg").innerText = error.message;
  } else {
    showDashboard();
  }
}

async function logout(){
  await supabase.auth.signOut();
  location.reload();
}

// CHANNELS
function getChannels(){
  return JSON.parse(localStorage.getItem("channels") || "[]");
}

function saveChannels(ch){
  localStorage.setItem("channels", JSON.stringify(ch));
}

function addChannel(){
  let val = document.getElementById("channelInput").value;
  if(!val) return;

  let ch = getChannels();
  ch.push(val);
  saveChannels(ch);

  loadChannels();
}

function loadChannels(){
  let div = document.getElementById("channels");
  let ch = getChannels();

  div.innerHTML = "";

  ch.forEach(id=>{
    let d = document.createElement("div");
    d.className = "channel";
    d.innerText = id;
    d.onclick = ()=>play(id);
    div.appendChild(d);
  });
}

function play(id){
  document.getElementById("player").src =
    "https://www.youtube.com/embed/live_stream?channel=" + id;
}

// INIT
async function init(){
  const { data } = await supabase.auth.getSession();

  if(data.session){
    showDashboard();
  } else {
    showLogin();
  }
}

init();
</script>

</body>
</html>
