<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<title>PootTubeLive</title>

<link href="https://fonts.googleapis.com/css2?family=UnifrakturMaguntia&display=swap" rel="stylesheet">

<style>
:root{
  --red:#ff0000;
}

*{box-sizing:border-box;}

body{
  margin:0;
  font-family:Segoe UI;
  background:#000;
  color:white;
}

/* HEADER */
.top{
  position:sticky;
  top:0;
  display:flex;
  justify-content:space-between;
  align-items:center;
  padding:16px 24px;
  background:#000;
}

/* 🔥 TITLE (STRONG + MEDIEVAL) */
.title{
  position:absolute;
  left:50%;
  transform:translateX(-50%);
  font-size:90px;

  font-family:'UnifrakturMaguntia', cursive;

  color:#ff0000;
  letter-spacing:5px;

  text-shadow:
    0 0 10px #ff0000,
    0 0 25px #ff0000,
    0 0 50px rgba(255,0,0,0.9),
    0 0 100px rgba(255,0,0,0.6);
}

/* INPUT */
input{
  padding:12px;
  background:#000;
  color:white;
  border-radius:8px;

  /* 🔴 RED BORDER FIXED */
  border:2px solid #ff0000;
}

/* 🔴 BUTTONS (FORCED RED BORDER) */
button, select{
  padding:12px 18px;
  font-size:15px;
  border-radius:8px;

  background:#000;
  color:white;

  border:2px solid #ff0000; /* ← THIS WAS THE ISSUE */
  cursor:pointer;

  transition:0.2s;
}

/* HOVER */
button:hover, select:hover{
  background:#111;
  box-shadow:
    0 0 10px #ff0000,
    0 0 20px rgba(255,0,0,0.8);
}

/* ROTATE BUTTON */
#rotateBtn{
  padding:12px 22px;
  font-size:18px;
}

/* ACTIVE */
#rotateBtn.active{
  background:#ff0000;
  color:black;
}

/* GRID */
.grid{
  display:grid;
  grid-template-columns:repeat(3,1fr);
  gap:12px;
  padding:12px;
}

/* CARD */
.card{
  position:relative;
  border-radius:8px;
  overflow:hidden;
  border:1px solid #300;
}

.card:hover{
  border-color:#ff0000;
  box-shadow:0 0 10px #ff0000;
}

/* VIDEO */
iframe{
  width:100%;
  height:220px;
  border:none;
}

/* INFO */
.info{
  padding:8px;
  background:#050505;
}

/* CLOSE */
.close{
  position:absolute;
  top:6px;
  right:6px;
  border:1px solid #ff0000;
  background:#000;
  color:white;
  cursor:pointer;
}
</style>
</head>

<body>

<div class="top">

  <div>
    <input id="input" placeholder="Paste YouTube link">
    <button onclick="add()">Add</button>
  </div>

  <div class="title">Poot Tube</div>

  <div>
    <select>
      <option>120s</option>
      <option>180s</option>
      <option>240s</option>
    </select>

    <button id="rotateBtn" onclick="rotate()">▶</button>
  </div>

</div>

<div id="grid" class="grid"></div>

<script>
let videos = [];

function extractId(input){
  if(input.includes("watch?v=")){
    return input.split("v=")[1].split("&")[0];
  }
  if(input.includes("youtu.be/")){
    return input.split("youtu.be/")[1];
  }
  return input;
}

function add(){
  let val = document.getElementById("input").value.trim();
  if(!val) return;

  let id = extractId(val);
  videos.push(id);
  render();

  document.getElementById("input").value="";
}

function remove(i){
  videos.splice(i,1);
  render();
}

function render(){
  let grid = document.getElementById("grid");
  grid.innerHTML="";

  videos.forEach((id,i)=>{
    let div = document.createElement("div");
    div.className="card";

    div.innerHTML = `
      <button class="close" onclick="remove(${i})">✖</button>

      <iframe src="https://www.youtube.com/embed/${id}?autoplay=1&mute=1&loop=1&playlist=${id}"></iframe>

      <div class="info">YouTube Video</div>
    `;

    grid.appendChild(div);
  });
}

function rotate(){
  let btn = document.getElementById("rotateBtn");
  btn.classList.toggle("active");

  setInterval(()=>{
    render();
  },60000);
}
</script>

</body>
</html>
