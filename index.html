<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<title>PootTube</title>

<link href="https://fonts.googleapis.com/css2?family=UnifrakturCook:wght@700&display=swap" rel="stylesheet">

<style>
:root{
  --theme:#ff2d2d;
}

*{box-sizing:border-box;}

body{
  margin:0;
  font-family:Segoe UI, sans-serif;
  background:#000;
  color:white;
}

/* HEADER */
.top{
  position:sticky;
  top:0;
  display:flex;
  justify-content:space-between;
  align-items:center;
  padding:14px 20px;
  background:rgba(0,0,0,0.9);
}

/* TITLE */
.title{
  position:absolute;
  left:50%;
  transform:translateX(-50%);
  font-family:'UnifrakturCook', cursive;
  font-size:56px;
  color:var(--theme);
  animation: glow 2s infinite alternate;
}

@keyframes glow{
  from{ text-shadow:0 0 10px var(--theme);}
  to{ text-shadow:0 0 40px var(--theme),0 0 80px var(--theme);}
}

/* INPUT */
input{
  padding:10px;
  border-radius:8px;
  border:none;
  background:#111;
  color:white;
}

/* BUTTONS */
button, select{
  padding:10px;
  border-radius:8px;
  border:none;
  background:#1f2937;
  color:white;
  cursor:pointer;
}

#rotateBtn.active{
  background:var(--theme);
  box-shadow:0 0 15px var(--theme);
}

/* GRID */
.grid{
  display:grid;
  gap:10px;
  padding:10px;
  height:calc(100vh - 80px);
}

.grid.grid-9{ grid-template-columns:repeat(3,1fr); }

/* CARD */
.card{
  position:relative;
  border-radius:8px;
  overflow:hidden;
  border:2px solid var(--theme);
  cursor:pointer;
}

.card.active{
  box-shadow:0 0 25px var(--theme);
}

/* INFO */
.info{
  position:absolute;
  bottom:0;
  width:100%;
  padding:6px;
  background:rgba(0,0,0,0.7);
  font-size:12px;
}

/* IFRAME */
iframe{
  width:100%;
  height:100%;
  border:none;
}

/* CLOSE */
.close{
  position:absolute;
  top:4px;
  right:4px;
  background:black;
  color:white;
  border:none;
  padding:2px 6px;
  cursor:pointer;
  z-index:2;
}
</style>
</head>

<body>

<div class="top">

  <div>
    <input id="input" placeholder="Paste video link or ID">
    <button onclick="add()">Add</button>
  </div>

  <div class="title">POOT TUBE</div>

  <div>
    <select id="timerSelect" onchange="updateTimer()">
      <option value="120000">120s</option>
      <option value="180000">180s</option>
      <option value="240000">240s</option>
    </select>

    <input type="color" id="colorPicker" value="#ff2d2d" onchange="changeTheme()">

    <button id="rotateBtn" onclick="toggleRotate()">▶</button>
  </div>

</div>

<div id="grid" class="grid grid-9"></div>

<script>
let videos = JSON.parse(localStorage.getItem("videos") || "[]");

let startIndex = 0;
let visibleCount = 9;
let delay = 120000;
let interval = null;
let rotating = false;

let activeAudio = 0;
let metaCache = {};

function save(){
  localStorage.setItem("videos", JSON.stringify(videos));
}

function extractId(input){
  if(input.includes("watch?v=")){
    return input.split("v=")[1].split("&")[0];
  }
  if(input.includes("youtu.be/")){
    return input.split("youtu.be/")[1];
  }
  return input;
}

function add(){
  let val = input.value.trim();
  if(!val) return;

  let id = extractId(val);
  if(id.length !== 11) return alert("Invalid video");

  if(videos.includes(id)) return;

  videos.push(id);
  save();
  render();
  input.value="";
}

function remove(index){
  videos.splice(index,1);
  save();
  render();
}

async function getMeta(id){
  if(metaCache[id]) return metaCache[id];

  try{
    let res = await fetch(`https://www.youtube.com/oembed?url=https://www.youtube.com/watch?v=${id}&format=json`);
    let data = await res.json();
    metaCache[id] = data;
    return data;
  }catch{
    return {title:id, author_name:"Unknown"};
  }
}

/* ⚡ OPTIMIZED RENDER */
async function render(){
  let grid = document.getElementById("grid");
  grid.innerHTML="";

  if(videos.length === 0) return;

  let batch = [];

  for(let i=0;i<visibleCount;i++){
    let index=(startIndex+i)%videos.length;
    let id=videos[index];

    let card=document.createElement("div");
    card.className="card";
    if(index===activeAudio) card.classList.add("active");

    let iframe=document.createElement("iframe");

    iframe.loading="lazy";
    iframe.src=`https://www.youtube.com/embed/${id}?autoplay=1&mute=${index===activeAudio?0:1}&loop=1&playlist=${id}&playsinline=1`;
    iframe.allow="autoplay";

    let info=document.createElement("div");
    info.className="info";

    getMeta(id).then(meta=>{
      info.innerText = meta.title + " • " + meta.author_name;
    });

    let close=document.createElement("button");
    close.className="close";
    close.innerText="✖";
    close.onclick=(e)=>{
      e.stopPropagation();
      remove(index);
    };

    card.onclick=()=>{
      activeAudio=index;
      render();
    };

    card.appendChild(close);
    card.appendChild(iframe);
    card.appendChild(info);

    batch.push(card);
  }

  batch.forEach((card,i)=>{
    setTimeout(()=>{
      grid.appendChild(card);
    }, i * 80);
  });
}

/* 🔥 PRELOAD NEXT */
function preloadNext(){
  let link = document.createElement("link");
  link.rel="preconnect";
  link.href="https://www.youtube.com";
  document.head.appendChild(link);
}

function next(){
  preloadNext();
  startIndex=(startIndex+visibleCount)%videos.length;
  render();
}

function changeTheme(){
  let color = colorPicker.value;
  document.documentElement.style.setProperty("--theme", color);
}

function updateTimer(){
  delay=parseInt(timerSelect.value);
  if(rotating){
    clearInterval(interval);
    interval=setInterval(next,delay);
  }
}

function toggleRotate(){
  rotating=!rotating;
  clearInterval(interval);

  if(rotating){
    interval=setInterval(next,delay);
    rotateBtn.classList.add("active");
  }else{
    rotateBtn.classList.remove("active");
  }
}

render();
</script>

</body>
</html>
