<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<title>PootiLurk</title>

<style>
body{
  margin:0;
  font-family:Segoe UI;
  background:#0b1220;
  color:white;
}

.top{
  padding:10px;
  background:#020617;
  display:flex;
  gap:10px;
}

input{
  padding:10px;
  flex:1;
}

button, select{
  padding:10px;
  background:#2563eb;
  color:white;
  border:none;
  cursor:pointer;
}

.container{
  display:flex;
  height:calc(100vh - 60px);
}

.sidebar{
  width:260px;
  background:#020617;
  overflow-y:auto;
  padding:10px;
}

.item{
  background:#111827;
  padding:8px;
  margin-bottom:5px;
  cursor:pointer;
}

.active{
  outline:2px solid #22c55e;
}

.main{
  flex:1;
}

iframe{
  width:100%;
  height:100%;
  border:none;
}
</style>
</head>

<body>

<div class="top">
  <input id="input" placeholder="Paste YouTube VIDEO link or ID only">
  <button onclick="add()">Add</button>

  <select id="timerSelect" onchange="updateTimer()">
    <option value="120000">120s</option>
    <option value="180000">180s</option>
    <option value="240000">240s</option>
  </select>

  <button onclick="toggleRotate()">Rotate ▶</button>
</div>

<div class="container">
  <div id="list" class="sidebar"></div>
  <div class="main">
    <iframe id="player"></iframe>
  </div>
</div>

<script>
let videos = JSON.parse(localStorage.getItem("videos") || "[]");
let current = 0;
let interval = null;
let delay = 120000;
let rotating = false;

function save(){
  localStorage.setItem("videos", JSON.stringify(videos));
}

// extract ONLY valid video IDs
function extractId(input){
  if(input.includes("watch?v=")){
    return input.split("v=")[1].split("&")[0];
  }
  if(input.includes("youtu.be/")){
    return input.split("youtu.be/")[1];
  }
  return input;
}

// validate ID length (YouTube IDs are 11 chars)
function isValid(id){
  return id.length === 11;
}

function add(){
  let val = document.getElementById("input").value.trim();
  if(!val) return;

  let id = extractId(val);

  if(!isValid(id)){
    alert("❌ Paste a valid YouTube VIDEO link (not channel)");
    return;
  }

  if(videos.includes(id)) return;

  videos.push(id);
  save();
  render();

  document.getElementById("input").value = "";
}

function remove(index){
  videos.splice(index,1);
  save();
  render();
}

function play(index){
  current = index;
  loadPlayer();
  render();
}

function loadPlayer(){
  if(videos.length === 0) return;

  let id = videos[current];

  document.getElementById("player").src =
    "https://www.youtube.com/embed/" + id +
    "?autoplay=1&mute=1&loop=1&playlist=" + id;
}

function render(){
  let list = document.getElementById("list");
  list.innerHTML = "";

  videos.forEach((v,i)=>{
    let d = document.createElement("div");
    d.className = "item " + (i === current ? "active" : "");
    d.innerText = v;

    d.onclick = ()=>play(i);

    let del = document.createElement("span");
    del.innerText = " ❌";
    del.style.float = "right";
    del.onclick = (e)=>{
      e.stopPropagation();
      remove(i);
    };

    d.appendChild(del);
    list.appendChild(d);
  });
}

// rotation step (guaranteed reload)
function next(){
  if(videos.length === 0) return;

  current = (current + 1) % videos.length;

  // force reload every time
  let player = document.getElementById("player");
  player.src = "";

  setTimeout(()=>{
    loadPlayer();
  }, 100);

  render();
}

function updateTimer(){
  delay = parseInt(document.getElementById("timerSelect").value);

  if(rotating){
    clearInterval(interval);
    interval = setInterval(next, delay);
  }
}

function toggleRotate(){
  if(videos.length < 2){
    alert("Add at least 2 videos to rotate");
    return;
  }

  rotating = !rotating;

  clearInterval(interval);

  if(rotating){
    interval = setInterval(next, delay);
  }
}

// init
if(videos.length > 0){
  loadPlayer();
}
render();
</script>

</body>
</html>
