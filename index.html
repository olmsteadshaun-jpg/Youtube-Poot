<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<title>PootiLurk</title>

<style>
body {
  margin:0;
  font-family:Segoe UI;
  background:#0b1220;
  color:white;
}

.container {
  display:flex;
  height:100vh;
}

.sidebar {
  width:300px;
  background:#020617;
  padding:15px;
}

.main {
  flex:1;
}

input {
  width:100%;
  padding:8px;
  margin-bottom:10px;
}

button {
  width:100%;
  padding:10px;
  background:#2563eb;
  color:white;
  border:none;
  margin-bottom:10px;
  cursor:pointer;
}

.channel {
  background:#111827;
  padding:8px;
  margin-bottom:5px;
  cursor:pointer;
}

iframe {
  width:100%;
  height:100%;
  border:none;
}
</style>
</head>

<body>

<div class="container">

  <div class="sidebar">
    <h3>PootiLurk</h3>

    <input id="channelInput" placeholder="Paste Channel ID">
    <button onclick="addChannel()">Add Channel</button>

    <div id="channels"></div>
  </div>

  <div class="main">
    <iframe id="player"></iframe>
  </div>

</div>

<script>
function getChannels(){
  return JSON.parse(localStorage.getItem("channels") || "[]");
}

function saveChannels(ch){
  localStorage.setItem("channels", JSON.stringify(ch));
}

function addChannel(){
  let val = document.getElementById("channelInput").value;
  if(!val) return;

  let ch = getChannels();
  ch.push(val);
  saveChannels(ch);

  document.getElementById("channelInput").value = "";
  loadChannels();
}

function loadChannels(){
  let div = document.getElementById("channels");
  let ch = getChannels();

  div.innerHTML = "";

  ch.forEach(id=>{
    let d = document.createElement("div");
    d.className = "channel";
    d.innerText = id;
    d.onclick = ()=>play(id);
    div.appendChild(d);
  });
}

function play(id){
  document.getElementById("player").src =
    "https://www.youtube.com/embed/live_stream?channel=" + id;
}

loadChannels();
</script>

</body>
</html>
